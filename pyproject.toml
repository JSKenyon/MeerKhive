[project]
name = "meerkhive"
version = "0.0.3"
description = "Python client for the SARAO MeerKAT archive."
readme = "README.md"
authors = [
    { name = "Jonathan Kenyon", email = "jonathan.simon.kenyon@gmail.com" },
    { name = "Zach Smith", email = "zsmith@sarao.ac.za" },
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.15",
    "gql>=4.0.0",
    "requests>=2.32.3",
    "rich>=13.9.4",
    "typer>=0.15.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.0",
    "responses>=0.25.7",
    "ruff>=0.16.7",
]

[tool.uv]
default-groups = []

[project.scripts]
meerkhive = "meerkhive.cli:app"

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

# Ruff configuration lives here rather than in a ruff.toml: a ruff.toml would
# take precedence over this section, and having both meant the settings below
# were silently ignored.
[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff 0.16 began formatting Python inside Markdown code blocks. The README's
# examples are written for readability rather than to the formatter's taste, so
# they are left alone; drop this to opt in.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Extend ruff's default rule set rather than replacing it. Only E501 is absent
# from the defaults; I (isort) is listed to keep the intent explicit.
extend-select = ["E501", "I"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (requires live credentials; run with -m slow)",
]
