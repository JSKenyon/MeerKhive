[project]
name = "meerkhive"
version = "0.0.2"
description = "Python client for the SARAO MeerKAT archive."
readme = "README.md"
authors = [
    { name = "Jonathan Kenyon", email = "jonathan.simon.kenyon@gmail.com" },
    { name = "Zach Smith", email = "zsmith@sarao.ac.za" },
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.15",
    "gql>=4.0.0",
    "requests>=2.32.3",
    "rich>=13.9.4",
    "typer>=0.15.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.0",
    "responses>=0.25.7",
    "ruff>=0.12.9",
]

[tool.uv]
default-groups = []

[project.scripts]
meerkhive = "meerkhive.cli:app"

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E501", "I", "F", "E", "W"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (requires live credentials; run with -m slow)",
]
