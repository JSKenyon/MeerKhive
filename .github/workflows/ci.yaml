name: MCP CI Workflow

# Specific github action events that you can lookup in their API
on:
  push:
    tags:
      - 'v*'
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: true

    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/ruff-action@v3
    - uses: astral-sh/ruff-action@v3
      with:
        args: "format --check --diff"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.8.5"
    - name: Install MeerKhive
      run: uv sync
    - name: Run MeerKhive to check for successful install
      run: uv run meerkhive --help

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    # Run on tagged push (generated by tbump).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.5"
      - name: Install MeerKhive
        run: uv sync
      - name: Build MeerKhive
        run: uv build
      - name: Publish to pypi
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}

  release:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Release
        uses: softprops/action-gh-release@v2.3.3
