name: MeerKhive CI Workflow

# Specific github action events that you can lookup in their API
on:
  push:
    tags:
      - 'v*'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/ruff-action@v3
    - uses: astral-sh/ruff-action@v3
      with:
        args: "format --check --diff"

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.8.6"
    - name: Install MeerKhive
      run: uv sync --group dev
    - name: Run MeerKhive to check for successful install
      run: uv run meerkhive --help
    - name: Run tests
      run: uv run python -m pytest tests/

  deploy:
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    # Run on tagged push (generated by tbump).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.6"
      - name: Install MeerKhive
        run: uv sync
      - name: Build MeerKhive
        run: uv build --no-sources
      - name: Publish to pypi
        run: uv publish

  release:
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Release
        uses: softprops/action-gh-release@v3.0.0
